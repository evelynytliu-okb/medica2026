const KEYSTORE = 'medica26:site-key';
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const ub64 = a => { let s=''; a.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}} };
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(SALT), iterations:ITER}, base, 256);
  return new Uint8Array(bits);
}
async function aesKey(raw){ return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']); }
async function dec(key, buf){ const u = new Uint8Array(buf); return crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, key, u.slice(12)); }
async function unlockWith(raw, remember){
  const key = await aesKey(raw);
  const html = new TextDecoder().decode(await dec(key, b64(PAYLOAD)));
  if (remember) ls.set(KEYSTORE, ub64(raw));
  window.__key = key;
  window.__decAudio = async k => {
    const r = await fetch(AUDIO[k]); if (!r.ok) throw new Error('audio');
    const js = await dec(window.__key, await r.arrayBuffer());
    return URL.createObjectURL(new Blob([js], {type:'text/javascript'}));
  };
  window.__podcastURL = async f => {
    const r = await fetch(POD[f]); if (!r.ok) throw new Error('podcast');
    const mp3 = await dec(window.__key, await r.arrayBuffer());
    return URL.createObjectURL(new Blob([mp3], {type:'audio/mpeg'}));
  };
  window.__siteInit = siteInit;
  // 用解密後的整頁換掉密碼頁（不用 document.write：有些瀏覽器會把內容接在密碼頁下面）
  const nd = new DOMParser().parseFromString(html, 'text/html');
  const root = document.importNode(nd.documentElement, true);
  document.replaceChild(root, document.documentElement);
  for (const old of [...root.querySelectorAll('script')]){      // 匯入的 script 不會自己執行，照順序重建
    const n = document.createElement('script');
    for (const at of old.attributes) n.setAttribute(at.name, at.value);
    n.textContent = old.textContent;
    old.replaceWith(n);
  }
  window.scrollTo(0, 0);
  if (location.hash) window.dispatchEvent(new HashChangeEvent('hashchange'));
}
function siteInit(){
  const bar = document.getElementById('siteBar'); if (!bar) return;
  bar.innerHTML = '<span>離線版 · '+BUILD_LABEL+' 版</span><button type="button" id="upd">檢查更新</button><button type="button" id="lockBtn">上鎖</button>';
  const upd = document.getElementById('upd');
  upd.addEventListener('click', async ()=>{
    if (!navigator.onLine){ upd.textContent = '現在離線，連上網路再按'; return; }
    upd.textContent = '檢查中…';
    try {
      const v = await (await fetch('version.json?t='+Date.now(), {cache:'no-store'})).json();
      if (v.build === BUILD){ upd.textContent = '已是最新版'; setTimeout(()=>upd.textContent='檢查更新', 3000); return; }
      upd.textContent = '下載新版…';
      if ('caches' in window){
        const c = await caches.open('medica26');
        await c.put('./', await fetch('./', {cache:'reload'}));
        await c.put('./index.html', await fetch('./index.html', {cache:'reload'}));
        const keep = new Set(Object.values(v.audio||{}));
        for (const req of await c.keys()){ const n = new URL(req.url).pathname.split('/').pop(); if (/^(audio|podcast)-.*\.bin$/.test(n) && !keep.has(n)) await c.delete(req); }
      }
      location.reload();
    } catch(e){ upd.textContent = '更新失敗，稍後再試'; }
  });
  document.getElementById('lockBtn').addEventListener('click', ()=>{ ls.set(KEYSTORE, null); location.reload(); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(()=>{});
(async ()=>{
  const saved = ls.get(KEYSTORE);
  if (saved){ try { await unlockWith(b64(saved), true); return; } catch(e){ ls.set(KEYSTORE, null); } }
  const f = document.getElementById('f'), msg = document.getElementById('msg');
  document.getElementById('pw').focus();
  f.addEventListener('submit', async e=>{
    e.preventDefault(); msg.className=''; msg.textContent = '解鎖中…';
    try { await unlockWith(await derive(document.getElementById('pw').value), document.getElementById('remember').checked); }
    catch(err){ msg.className='bad'; msg.textContent = '密碼不對'; }
  });
})();
</script>
</body></html>
